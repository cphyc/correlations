[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "correlations"
version = "0.0.3"
description = "Compute correlation functions for Gaussian random fields."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Corentin Cadiou", email = "contact@cphyc.me"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0", "scipy>=1.11", "joblib>=1.3", "numba>=0.60", "tqdm>=4.65"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
notebook = ["matplotlib>=3.7", "ipython>=8", "jupyterlab>=4"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "pre-commit>=4"]

[project.urls]
Repository = "https://github.com/cphyc/correlations"

[tool.hatch.build.targets.wheel]
packages = ["correlations"]

[tool.hatch.build.targets.sdist]
include = [
    "/correlations", "/benchmarks", "/README.md", "/pyproject.toml",
    "/.github", "/.pre-commit-config.yaml", "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["correlations"]
filterwarnings = ["error"]
markers = ["slow: multidimensional numerical integration reference checks"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["correlations"]
